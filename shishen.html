<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>十天干十神双环盘</title>
    <style>
        :root {
            --bg-1: #07060b;
            --bg-2: #120f1f;
            --ink-soft: rgba(246, 232, 210, 0.72);
            --ink-main: #f0dfc1;
            --spin-duration: 373ms;
            --spin-ease: cubic-bezier(0.22, 1, 0.36, 1);
            --god-fade-duration: 113ms;
            --line-gold: rgba(218, 181, 111, 0.48);
            --glow-gold: rgba(217, 162, 62, 0.28);
            --glow-violet: rgba(160, 118, 232, 0.26);
            --glow-cyan: rgba(102, 200, 255, 0.18);
            --glow-amber: rgba(247, 214, 154, 0.28);
            --wood: #4f9b63;
            --fire: #c75f4f;
            --earth: #dcb642;
            --metal: #f4f5f6;
            --water: #4f6fa8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            color: var(--ink-main);
            font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", Arial, sans-serif;
            background:
                radial-gradient(circle at 50% 32%, rgba(247, 214, 154, 0.08), transparent 20%),
                radial-gradient(circle at 50% 30%, rgba(112, 71, 33, 0.10), transparent 28%),
                radial-gradient(circle at 18% 20%, rgba(110, 82, 148, 0.18), transparent 30%),
                radial-gradient(circle at 82% 12%, rgba(62, 109, 156, 0.18), transparent 25%),
                linear-gradient(180deg, var(--bg-2), var(--bg-1));
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
        }

        body::before {
            background-image:
                radial-gradient(circle at 12% 20%, rgba(255, 255, 255, 0.55) 0 1px, transparent 1.5px),
                radial-gradient(circle at 74% 18%, rgba(255, 255, 255, 0.4) 0 1px, transparent 1.5px),
                radial-gradient(circle at 88% 62%, rgba(255, 255, 255, 0.42) 0 1px, transparent 1.5px),
                radial-gradient(circle at 28% 78%, rgba(255, 255, 255, 0.36) 0 1px, transparent 1.5px),
                radial-gradient(circle at 48% 86%, rgba(255, 255, 255, 0.32) 0 1px, transparent 1.5px),
                radial-gradient(circle at 6% 14%, rgba(255, 249, 238, 0.54) 0 1.2px, transparent 1.8px),
                radial-gradient(circle at 16% 34%, rgba(186, 214, 255, 0.42) 0 0.9px, transparent 1.6px),
                radial-gradient(circle at 22% 12%, rgba(255, 238, 209, 0.42) 0 1px, transparent 1.7px),
                radial-gradient(circle at 30% 24%, rgba(255, 255, 255, 0.46) 0 1.1px, transparent 1.8px),
                radial-gradient(circle at 36% 8%, rgba(210, 221, 255, 0.35) 0 0.9px, transparent 1.5px),
                radial-gradient(circle at 41% 18%, rgba(255, 247, 229, 0.34) 0 0.85px, transparent 1.4px),
                radial-gradient(circle at 57% 10%, rgba(255, 255, 255, 0.40) 0 1px, transparent 1.6px),
                radial-gradient(circle at 64% 27%, rgba(189, 220, 255, 0.38) 0 0.9px, transparent 1.5px),
                radial-gradient(circle at 71% 8%, rgba(255, 239, 217, 0.36) 0 0.95px, transparent 1.6px),
                radial-gradient(circle at 83% 24%, rgba(255, 255, 255, 0.46) 0 1.15px, transparent 1.8px),
                radial-gradient(circle at 93% 14%, rgba(207, 225, 255, 0.34) 0 0.85px, transparent 1.5px),
                radial-gradient(circle at 8% 46%, rgba(255, 241, 219, 0.30) 0 0.85px, transparent 1.4px),
                radial-gradient(circle at 14% 58%, rgba(255, 255, 255, 0.38) 0 1px, transparent 1.6px),
                radial-gradient(circle at 24% 44%, rgba(197, 220, 255, 0.34) 0 0.9px, transparent 1.5px),
                radial-gradient(circle at 33% 56%, rgba(255, 246, 228, 0.32) 0 0.95px, transparent 1.5px),
                radial-gradient(circle at 44% 40%, rgba(255, 255, 255, 0.28) 0 0.8px, transparent 1.35px),
                radial-gradient(circle at 52% 52%, rgba(188, 214, 255, 0.36) 0 0.9px, transparent 1.55px),
                radial-gradient(circle at 62% 44%, rgba(255, 241, 220, 0.34) 0 1px, transparent 1.6px),
                radial-gradient(circle at 69% 58%, rgba(255, 255, 255, 0.32) 0 0.88px, transparent 1.45px),
                radial-gradient(circle at 78% 46%, rgba(191, 222, 255, 0.34) 0 0.92px, transparent 1.5px),
                radial-gradient(circle at 86% 54%, rgba(255, 245, 226, 0.36) 0 1px, transparent 1.6px),
                radial-gradient(circle at 95% 42%, rgba(255, 255, 255, 0.26) 0 0.75px, transparent 1.35px),
                radial-gradient(circle at 10% 74%, rgba(255, 255, 255, 0.30) 0 0.85px, transparent 1.4px),
                radial-gradient(circle at 18% 88%, rgba(186, 217, 255, 0.30) 0 0.78px, transparent 1.35px),
                radial-gradient(circle at 26% 68%, rgba(255, 240, 219, 0.34) 0 0.95px, transparent 1.55px),
                radial-gradient(circle at 38% 82%, rgba(255, 255, 255, 0.30) 0 0.84px, transparent 1.4px),
                radial-gradient(circle at 54% 74%, rgba(192, 220, 255, 0.32) 0 0.88px, transparent 1.45px),
                radial-gradient(circle at 63% 90%, rgba(255, 244, 222, 0.36) 0 1px, transparent 1.6px),
                radial-gradient(circle at 72% 70%, rgba(255, 255, 255, 0.28) 0 0.82px, transparent 1.38px),
                radial-gradient(circle at 82% 84%, rgba(185, 214, 255, 0.34) 0 0.9px, transparent 1.5px),
                radial-gradient(circle at 92% 76%, rgba(255, 240, 221, 0.30) 0 0.85px, transparent 1.45px);
            opacity: 0.78;
            animation: skyPulse 8s ease-in-out infinite;
        }

        body::after {
            background:
                radial-gradient(circle at 15% 28%, rgba(255, 255, 255, 0.04) 0 0.8px, transparent 1.4px),
                radial-gradient(circle at 27% 62%, rgba(255, 255, 255, 0.03) 0 0.7px, transparent 1.3px),
                radial-gradient(circle at 43% 16%, rgba(255, 255, 255, 0.04) 0 0.75px, transparent 1.35px),
                radial-gradient(circle at 58% 78%, rgba(255, 255, 255, 0.03) 0 0.7px, transparent 1.3px),
                radial-gradient(circle at 74% 38%, rgba(255, 255, 255, 0.04) 0 0.8px, transparent 1.4px),
                radial-gradient(circle at 88% 70%, rgba(255, 255, 255, 0.03) 0 0.72px, transparent 1.32px),
                repeating-linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.00) 0,
                    rgba(255, 255, 255, 0.00) 5px,
                    rgba(255, 255, 255, 0.012) 6px
                );
            mix-blend-mode: soft-light;
            opacity: 0.35;
        }

        @keyframes skyPulse {
            0%, 100% { opacity: 0.72; }
            50% { opacity: 0.88; }
        }

        .app {
            width: min(1280px, calc(100vw - 32px));
            margin: 0 auto;
            padding: 30px 0 36px;
        }

        .layout {
            display: block;
        }

        .board-shell {
            position: relative;
            max-width: 860px;
            margin: 0 auto;
            padding: 18px;
            border: 1px solid rgba(214, 178, 108, 0.18);
            border-radius: 32px;
            background:
                linear-gradient(180deg, rgba(255, 246, 229, 0.03), rgba(255, 246, 229, 0.01)),
                rgba(16, 11, 21, 0.68);
            box-shadow:
                inset 0 0 0 1px rgba(255, 240, 214, 0.04),
                0 22px 60px rgba(0, 0, 0, 0.35);
        }

        .board-shell::before,
        .board-shell::after {
            content: "";
            position: absolute;
            width: 52px;
            height: 52px;
            border: 1px solid rgba(214, 178, 108, 0.24);
            opacity: 0.65;
        }

        .board-shell::before {
            inset: 12px auto auto 12px;
            border-right: none;
            border-bottom: none;
            border-radius: 18px 0 0 0;
        }

        .board-shell::after {
            inset: auto 12px 12px auto;
            border-left: none;
            border-top: none;
            border-radius: 0 0 18px 0;
        }

        .wheel {
            position: relative;
            width: min(78vmin, 760px);
            aspect-ratio: 1;
            margin: 34px auto 0;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 50%, rgba(136, 98, 210, 0.18), transparent 24%),
                radial-gradient(circle at 50% 50%, rgba(104, 190, 255, 0.08), transparent 42%),
                radial-gradient(circle, rgba(255, 245, 226, 0.05) 0 18%, transparent 18.5%),
                radial-gradient(circle, rgba(255, 240, 214, 0.04) 0 38%, transparent 38.5%),
                radial-gradient(circle, rgba(255, 240, 214, 0.03) 0 57%, transparent 57.5%),
                radial-gradient(circle, rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.05));
            box-shadow:
                inset 0 0 0 1px rgba(255, 235, 198, 0.08),
                0 0 50px rgba(217, 162, 62, 0.08),
                0 0 110px rgba(118, 84, 188, 0.16);
            overflow: hidden;
        }

        .wheel::before {
            content: "";
            position: absolute;
            inset: 2.2%;
            border-radius: 50%;
            border: 1px solid rgba(220, 185, 123, 0.14);
            pointer-events: none;
        }

        .wheel::after {
            content: "";
            position: absolute;
            inset: 6.5%;
            border-radius: 50%;
            border: 1px solid rgba(210, 189, 149, 0.07);
            box-shadow:
                0 0 24px rgba(247, 214, 154, 0.08),
                0 0 56px rgba(118, 84, 188, 0.14);
            pointer-events: none;
        }

        .spokes,
        .fixed-layer,
        .ring-group,
        .star-layer {
            position: absolute;
            inset: 0;
        }

        .spokes {
            border-radius: 50%;
            background:
                repeating-conic-gradient(
                    from -90deg,
                    rgba(255, 232, 194, 0.08) 0deg 0.8deg,
                    transparent 0.8deg 36deg
                );
            mask: radial-gradient(circle, transparent 0 20%, #000 20.5% 85%, transparent 85.5%);
            -webkit-mask: radial-gradient(circle, transparent 0 20%, #000 20.5% 85%, transparent 85.5%);
            opacity: 0.9;
        }

        .ring-group {
            transition: transform var(--spin-duration) var(--spin-ease);
            transform-origin: center;
        }

        .ring-surface {
            position: absolute;
            inset: 0;
            border-radius: 50%;
        }

        .outer-ring {
            background:
                repeating-conic-gradient(
                    from -90deg,
                    rgba(245, 224, 184, 0.22) 0deg 0.65deg,
                    transparent 0.65deg 36deg
                ),
                radial-gradient(circle at 50% 50%, rgba(92, 64, 132, 0.12), transparent 62%),
                conic-gradient(
                    from -90deg,
                    rgba(17, 17, 28, 0.96) 0deg 36deg,
                    rgba(21, 18, 34, 0.96) 36deg 72deg,
                    rgba(15, 20, 34, 0.96) 72deg 108deg,
                    rgba(20, 16, 28, 0.96) 108deg 144deg,
                    rgba(16, 18, 31, 0.96) 144deg 180deg,
                    rgba(21, 17, 35, 0.96) 180deg 216deg,
                    rgba(16, 19, 29, 0.96) 216deg 252deg,
                    rgba(21, 16, 30, 0.96) 252deg 288deg,
                    rgba(15, 21, 34, 0.96) 288deg 324deg,
                    rgba(19, 16, 31, 0.96) 324deg 360deg
                );
            mask: radial-gradient(circle, transparent 0 48.5%, #000 49% 77%, transparent 77.5%);
            -webkit-mask: radial-gradient(circle, transparent 0 48.5%, #000 49% 77%, transparent 77.5%);
            box-shadow:
                inset 0 0 0 1px rgba(255, 237, 207, 0.16),
                inset 0 0 18px rgba(246, 225, 181, 0.05),
                0 0 28px rgba(92, 64, 132, 0.12),
                0 0 42px rgba(153, 117, 222, 0.12);
        }

        .outer-ring::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                radial-gradient(circle, transparent 0 48.2%, rgba(251, 238, 214, 0.92) 48.7%, rgba(251, 238, 214, 0.78) 49%, transparent 49.3%),
                radial-gradient(circle, transparent 0 76.7%, rgba(251, 238, 214, 0.88) 77.1%, rgba(251, 238, 214, 0.72) 77.4%, transparent 77.8%);
            filter: drop-shadow(0 0 8px rgba(247, 226, 186, 0.22)) drop-shadow(0 0 16px rgba(166, 127, 231, 0.12));
            pointer-events: none;
        }

        .inner-ring {
            background:
                repeating-conic-gradient(
                    from -90deg,
                    rgba(245, 224, 184, 0.22) 0deg 0.8deg,
                    transparent 0.8deg 36deg
                ),
                radial-gradient(circle at 50% 50%, rgba(92, 64, 132, 0.12), transparent 56%),
                conic-gradient(
                    from -90deg,
                    rgba(17, 17, 28, 0.96) 0deg 36deg,
                    rgba(21, 18, 34, 0.96) 36deg 72deg,
                    rgba(15, 20, 34, 0.96) 72deg 108deg,
                    rgba(20, 16, 28, 0.96) 108deg 144deg,
                    rgba(16, 18, 31, 0.96) 144deg 180deg,
                    rgba(21, 17, 35, 0.96) 180deg 216deg,
                    rgba(16, 19, 29, 0.96) 216deg 252deg,
                    rgba(21, 16, 30, 0.96) 252deg 288deg,
                    rgba(15, 21, 34, 0.96) 288deg 324deg,
                    rgba(19, 16, 31, 0.96) 324deg 360deg
                );
            mask: radial-gradient(circle, transparent 0 28.5%, #000 29% 45.5%, transparent 46%);
            -webkit-mask: radial-gradient(circle, transparent 0 28.5%, #000 29% 45.5%, transparent 46%);
            box-shadow:
                inset 0 0 0 1px rgba(255, 244, 222, 0.16),
                inset 0 0 16px rgba(246, 225, 181, 0.05),
                0 0 24px rgba(92, 64, 132, 0.12),
                0 0 34px rgba(153, 117, 222, 0.10);
        }

        .inner-ring::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background:
                radial-gradient(circle, transparent 0 28.2%, rgba(251, 238, 214, 0.92) 28.7%, rgba(251, 238, 214, 0.72) 29%, transparent 29.35%),
                radial-gradient(circle, transparent 0 45.2%, rgba(251, 238, 214, 0.88) 45.55%, rgba(251, 238, 214, 0.70) 45.85%, transparent 46.2%);
            filter: drop-shadow(0 0 7px rgba(247, 226, 186, 0.22)) drop-shadow(0 0 14px rgba(166, 127, 231, 0.10));
            pointer-events: none;
        }

        .ring-items {
            position: absolute;
            inset: 0;
        }

        .stem-item,
        .god-item {
            position: absolute;
            transform: translate(-50%, -50%);
            display: grid;
            place-items: center;
            text-align: center;
            user-select: none;
        }

        .stem-item {
            width: clamp(42px, 7.4vmin, 60px);
            height: clamp(42px, 7.4vmin, 60px);
            border-radius: 50%;
            border: 1px solid rgba(255, 244, 220, 0.34);
            box-shadow:
                0 0 12px rgba(0, 0, 0, 0.28),
                inset 0 0 10px rgba(255, 255, 255, 0.08),
                0 0 18px rgba(247, 214, 154, 0.08);
        }

        .stem-face {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
            transition: transform var(--spin-duration) var(--spin-ease);
            transform-origin: center;
            will-change: transform;
        }

        .stem-item .main {
            font-size: clamp(1.25rem, 2.2vmin, 1.6rem);
            line-height: 0.82;
            margin-bottom: 0;
            font-weight: 600;
            color: #111111;
        }

        .stem-item .sub {
            font-size: clamp(0.52rem, 1.05vmin, 0.68rem);
            line-height: 0.72;
            letter-spacing: 0.08em;
            color: #111111;
            margin-top: -4px;
        }

        .stem-item[data-element="木"] { background: linear-gradient(180deg, rgba(98, 170, 114, 0.94), rgba(46, 93, 57, 0.94)); }
        .stem-item[data-element="火"] { background: linear-gradient(180deg, rgba(214, 103, 88, 0.96), rgba(110, 39, 29, 0.94)); }
        .stem-item[data-element="土"] { background: linear-gradient(180deg, rgba(220, 182, 66, 0.98), rgba(140, 107, 22, 0.94)); }
        .stem-item[data-element="金"] { background: linear-gradient(180deg, rgba(244, 245, 246, 0.98), rgba(178, 181, 188, 0.94)); }
        .stem-item[data-element="水"] { background: linear-gradient(180deg, rgba(96, 129, 195, 0.96), rgba(39, 57, 105, 0.94)); }

        .god-item {
            width: clamp(58px, 9.8vmin, 88px);
            height: clamp(58px, 9.8vmin, 88px);
            padding: 6px;
            border-radius: 50%;
            border: 1px solid rgba(249, 230, 196, 0.24);
            background:
                linear-gradient(180deg, rgba(255, 246, 225, 0.11), rgba(255, 246, 225, 0.03)),
                linear-gradient(180deg, rgba(77, 53, 109, 0.16), rgba(12, 16, 29, 0.04)),
                rgba(13, 10, 22, 0.76);
            box-shadow:
                0 10px 18px rgba(0, 0, 0, 0.22),
                inset 0 0 0 1px rgba(255, 255, 255, 0.03),
                0 0 20px rgba(118, 84, 188, 0.08);
            backdrop-filter: blur(6px);
            transition:
                box-shadow var(--god-fade-duration) ease,
                border-color var(--god-fade-duration) ease,
                background-color var(--god-fade-duration) ease;
        }

        .god-item .main {
            font-size: clamp(0.92rem, 1.65vmin, 1.16rem);
            letter-spacing: 0.08em;
            color: #f4e5c4;
            line-height: 1;
            transition:
                opacity var(--god-fade-duration) ease,
                filter var(--god-fade-duration) ease,
                transform var(--god-fade-duration) ease;
        }

        .god-item .sub {
            font-size: clamp(0.48rem, 0.9vmin, 0.64rem);
            color: rgba(249, 229, 197, 0.56);
            margin-top: 2px;
            line-height: 1;
            transition:
                opacity var(--god-fade-duration) ease,
                filter var(--god-fade-duration) ease,
                transform var(--god-fade-duration) ease;
        }

        .god-item.is-changing {
            border-color: rgba(185, 168, 205, 0.18);
            box-shadow:
                0 8px 14px rgba(0, 0, 0, 0.18),
                inset 0 0 0 1px rgba(255, 255, 255, 0.02),
                0 0 10px rgba(118, 84, 188, 0.05);
        }

        .god-item.is-changing .main,
        .god-item.is-changing .sub {
            opacity: 0.16;
            filter: blur(0.8px);
            transform: translateY(1px) scale(0.985);
        }

        .fixed-layer {
            pointer-events: none;
        }

        .pointer {
            position: absolute;
            top: -54px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 36px solid transparent;
            border-right: 36px solid transparent;
            border-top: 68px solid rgba(244, 221, 171, 0.96);
            filter: drop-shadow(0 0 14px rgba(247, 226, 186, 0.34)) drop-shadow(0 0 28px rgba(166, 127, 231, 0.22));
            z-index: 5;
        }

        .star-group {
            position: absolute;
            inset: 0;
            transform-origin: center;
            transition: transform var(--spin-duration) var(--spin-ease);
            pointer-events: none;
        }

        .star-layer {
            position: absolute;
            inset: 28.5%;
            display: grid;
            place-items: center;
        }

        .star-svg {
            width: 100%;
            aspect-ratio: 1;
            overflow: visible;
            filter:
                drop-shadow(0 0 16px rgba(247, 214, 154, 0.18))
                drop-shadow(0 0 28px rgba(118, 84, 188, 0.12));
        }

        .star-svg .sheng-halo {
            fill: none;
            stroke: rgba(115, 201, 255, 0.18);
            stroke-width: 4.6;
        }

        .star-svg .sheng-circle {
            fill: none;
            stroke: rgba(173, 226, 255, 0.54);
            stroke-width: 1.4;
        }

        .star-svg .star-halo {
            fill: none;
            stroke: rgba(246, 220, 172, 0.20);
            stroke-width: 4.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .star-svg .star-path {
            fill: none;
            stroke: rgba(248, 228, 191, 0.92);
            stroke-width: 1.65;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .star-svg .node-ring {
            fill: rgba(14, 12, 24, 0.94);
            stroke: rgba(246, 227, 191, 0.38);
            stroke-width: 0.95;
            filter: drop-shadow(0 0 9px rgba(247, 214, 154, 0.18));
        }

        .star-svg .node-wood { fill: #78d497; }
        .star-svg .node-fire { fill: #f08f78; }
        .star-svg .node-earth { fill: #f0cf62; }
        .star-svg .node-metal { fill: #fff9f1; }
        .star-svg .node-water { fill: #79aaf6; }

        .side-panel {
            display: grid;
            gap: 14px;
        }

        .panel-card {
            padding: 16px 18px;
            border-radius: 22px;
            border: 1px solid rgba(214, 178, 108, 0.16);
            background:
                linear-gradient(180deg, rgba(255, 246, 225, 0.05), rgba(255, 246, 225, 0.02)),
                rgba(15, 10, 19, 0.72);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
        }

        .panel-card h2 {
            font-size: 1rem;
            letter-spacing: 0.12em;
            margin-bottom: 12px;
            color: #f3dfbb;
        }

        .readout-list {
            display: grid;
            gap: 10px;
            color: var(--ink-soft);
            font-size: 0.94rem;
        }

        .readout-list strong {
            color: #f4e5c4;
            font-weight: 600;
        }

        .readout-emphasis {
            margin-top: 14px;
            padding-top: 12px;
            border-top: 1px solid rgba(214, 178, 108, 0.12);
            color: rgba(249, 229, 197, 0.84);
            line-height: 1.7;
        }

        .legend {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px 12px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--ink-soft);
            font-size: 0.9rem;
        }

        .legend-swatch {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.08);
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 18px;
            margin-top: 24px;
            max-width: 860px;
            margin-left: auto;
            margin-right: auto;
        }

        .control-card {
            padding: 16px 18px 18px;
            border-radius: 24px;
            border: 1px solid rgba(214, 178, 108, 0.16);
            background:
                linear-gradient(180deg, rgba(255, 246, 225, 0.05), rgba(255, 246, 225, 0.02)),
                rgba(14, 10, 18, 0.76);
        }

        .control-card h3 {
            font-size: 0.98rem;
            letter-spacing: 0.12em;
            margin-bottom: 12px;
            color: #f1deb9;
        }

        .button-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 12px;
            justify-content: center;
        }

        button {
            border: 1px solid rgba(234, 205, 148, 0.24);
            border-radius: 999px;
            padding: 10px 14px;
            color: #f4e5c4;
            background:
                linear-gradient(180deg, rgba(255, 244, 219, 0.08), rgba(255, 244, 219, 0.02)),
                rgba(42, 28, 18, 0.62);
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            font: inherit;
            letter-spacing: 0.06em;
        }

        button:hover {
            transform: translateY(-1px);
            border-color: rgba(234, 205, 148, 0.40);
            box-shadow: 0 10px 18px rgba(0, 0, 0, 0.16);
        }

        input[type="range"] {
            width: 100%;
            accent-color: #d3aa5a;
            cursor: pointer;
        }

        .hint-text {
            color: rgba(249, 229, 197, 0.68);
            line-height: 1.72;
            font-size: 0.92rem;
        }

        @media (max-width: 1080px) {
            .layout,
            .controls {
                grid-template-columns: 1fr;
            }

            .wheel {
                width: min(86vmin, 700px);
            }
        }

        @media (max-width: 640px) {
            .app {
                width: min(100vw - 20px, 100%);
                padding-top: 18px;
            }

            .board-shell,
            .panel-card,
            .control-card {
                border-radius: 18px;
            }

            .wheel {
                width: min(92vmin, 620px);
            }

            .god-item {
                width: clamp(54px, 11.8vmin, 76px);
                height: clamp(54px, 11.8vmin, 76px);
            }
        }
    </style>
</head>
<body>
    <main class="app">
        <section class="layout">
            <div class="board-shell">
                <div class="wheel" id="wheel">
                    <div class="spokes"></div>

                    <div class="ring-group" id="outerGroup">
                        <div class="ring-surface outer-ring"></div>
                        <div class="ring-items" id="outerItems"></div>
                    </div>

                    <div class="ring-group" id="innerGroup">
                        <div class="ring-surface inner-ring"></div>
                        <div class="ring-items" id="innerItems"></div>
                    </div>

                    <div class="star-group" id="starGroup">
                        <div class="star-layer">
                            <svg class="star-svg" id="elementStar" viewBox="0 0 100 100" aria-hidden="true"></svg>
                        </div>
                    </div>

                    <div class="fixed-layer">
                        <div class="pointer"></div>
                    </div>
                </div>
            </div>
        </section>

        <section class="controls">
            <section class="control-card">
                <div class="button-row">
                    <button type="button" data-action="step" data-target="inner" data-step="-36">逆转一位</button>
                    <button type="button" data-action="reset" data-target="inner">归位</button>
                    <button type="button" data-action="step" data-target="inner" data-step="36">顺转一位</button>
                </div>
                <input id="innerSlider" type="range" min="0" max="9" step="1" value="0">
            </section>
        </section>
    </main>

    <script>
        const stems = [
            { symbol: "甲", label: "阳木", element: "木" },
            { symbol: "乙", label: "阴木", element: "木" },
            { symbol: "丙", label: "阳火", element: "火" },
            { symbol: "丁", label: "阴火", element: "火" },
            { symbol: "戊", label: "阳土", element: "土" },
            { symbol: "己", label: "阴土", element: "土" },
            { symbol: "庚", label: "阳金", element: "金" },
            { symbol: "辛", label: "阴金", element: "金" },
            { symbol: "壬", label: "阳水", element: "水" },
            { symbol: "癸", label: "阴水", element: "水" }
        ];

        const state = {
            inner: 0,
            innerTarget: 0
        };

        const godNotes = {
            "比肩": "同我同气",
            "劫财": "同我异气",
            "食神": "我生而和",
            "伤官": "我生而烈",
            "偏财": "我克偏势",
            "正财": "我克正序",
            "七杀": "克我偏锋",
            "正官": "克我正令",
            "偏印": "生我偏源",
            "正印": "生我正源"
        };

        const godOrderYang = ["比肩", "劫财", "食神", "伤官", "偏财", "正财", "七杀", "正官", "偏印", "正印"];
        const godOrderYin = ["比肩", "伤官", "食神", "正财", "偏财", "正官", "七杀", "正印", "偏印", "劫财"];

        const innerGroup = document.getElementById("innerGroup");
        const innerItems = document.getElementById("innerItems");
        const outerItems = document.getElementById("outerItems");
        const starGroup = document.getElementById("starGroup");
        const innerSlider = document.getElementById("innerSlider");

        const elementNodes = [
            { angle: -72, className: "node-wood" },
            { angle: 0, className: "node-fire" },
            { angle: 72, className: "node-earth" },
            { angle: 144, className: "node-metal" },
            { angle: 216, className: "node-water" }
        ];

        function normalizeAngle(value) {
            const normalized = value % 360;
            return normalized < 0 ? normalized + 360 : normalized;
        }

        function snapRotation(value) {
            return normalizeAngle(Math.round(value / 36) * 36);
        }

        function getClosestAnimatedAngle(currentAngle, targetAngle) {
            const candidates = [
                targetAngle - 360,
                targetAngle,
                targetAngle + 360
            ];

            return candidates.reduce((closest, candidate) => {
                return Math.abs(candidate - currentAngle) < Math.abs(closest - currentAngle)
                    ? candidate
                    : closest;
            });
        }

        function getClosestContinuousAngle(referenceAngle, wrappedAngle) {
            return getClosestAnimatedAngle(referenceAngle, wrappedAngle);
        }

        function getRenderedRotation(element, fallbackAngle = 0) {
            const transform = window.getComputedStyle(element).transform;
            if (!transform || transform === "none") {
                return fallbackAngle;
            }

            try {
                const matrix = new DOMMatrixReadOnly(transform);
                return Math.atan2(matrix.b, matrix.a) * 180 / Math.PI;
            } catch (_) {
                return fallbackAngle;
            }
        }

        function createRingItem(item, angle, radius, className, template) {
            const node = document.createElement("div");
            node.className = className;
            const rad = angle * Math.PI / 180;
            const x = 50 + Math.cos(rad) * radius;
            const y = 50 + Math.sin(rad) * radius;
            node.style.left = `${x}%`;
            node.style.top = `${y}%`;
            node.innerHTML = template(item);
            return node;
        }

        function buildStemRing() {
            stems.forEach((stem, index) => {
                const angle = -90 + index * 36;
                const node = createRingItem(
                    stem,
                    angle,
                    26.2,
                    "stem-item",
                    (item) => `
                        <div class="stem-face">
                            <div class="main">${item.symbol}</div>
                            <div class="sub">${item.label}</div>
                        </div>
                    `
                );
                node.dataset.element = stem.element;
                innerItems.appendChild(node);
            });
        }

        function buildGodRing() {
            for (let index = 0; index < 10; index += 1) {
                const angle = -90 + index * 36;
                const node = createRingItem(
                    null,
                    angle,
                    41.5,
                    "god-item",
                    () => `
                        <div class="main"></div>
                        <div class="sub"></div>
                    `
                );
                outerItems.appendChild(node);
            }
        }

        function buildStar() {
            const svg = document.getElementById("elementStar");
            const radius = 37;
            const center = 50;

            const points = elementNodes.map((node) => {
                const rad = node.angle * Math.PI / 180;
                return {
                    ...node,
                    x: center + Math.cos(rad) * radius,
                    y: center + Math.sin(rad) * radius
                };
            });

            const starOrder = [0, 2, 4, 1, 3, 0];
            const pathPoints = starOrder.map((index) => `${points[index].x},${points[index].y}`).join(" ");

            svg.innerHTML = `
                <circle class="sheng-halo" cx="${center}" cy="${center}" r="${radius}"></circle>
                <circle class="sheng-circle" cx="${center}" cy="${center}" r="${radius}"></circle>
                <polyline class="star-halo" points="${pathPoints}"></polyline>
                <polyline class="star-path" points="${pathPoints}"></polyline>
                ${points.map((point) => `
                    <g>
                        <circle class="node-ring" cx="${point.x}" cy="${point.y}" r="5.4"></circle>
                        <circle class="${point.className}" cx="${point.x}" cy="${point.y}" r="3.1"></circle>
                    </g>
                `).join("")}
            `;
        }

        function getTopStemIndex() {
            const normalizedInner = normalizeAngle(state.innerTarget);
            return ((Math.round(-normalizedInner / 36) % 10) + 10) % 10;
        }

        function updateGodRing(animate = true) {
            const dayStem = stems[getTopStemIndex()];
            const isYang = dayStem.label.startsWith("阳");
            const order = isYang ? godOrderYang : godOrderYin;

            outerItems.querySelectorAll(".god-item").forEach((node, index) => {
                const godName = order[index];
                const main = node.querySelector(".main");
                const sub = node.querySelector(".sub");
                const nextNote = godNotes[godName];

                if (!main || !sub) return;

                if (main.textContent === godName && sub.textContent === nextNote) return;

                if (!animate || !main.textContent) {
                    main.textContent = godName;
                    sub.textContent = nextNote;
                    return;
                }

                clearTimeout(node._godSwapTimer);
                node.classList.add("is-changing");

                node._godSwapTimer = setTimeout(() => {
                    main.textContent = godName;
                    sub.textContent = nextNote;
                    requestAnimationFrame(() => {
                        node.classList.remove("is-changing");
                    });
                }, 140);
            });
        }

        function keepInnerItemsUpright() {
            innerItems.querySelectorAll(".stem-item").forEach((node) => {
                const face = node.querySelector(".stem-face");
                if (face) {
                    face.style.transform = `rotate(${-state.inner}deg)`;
                }
            });
        }

        function setInnerRotation(value, options = {}) {
            const { animateGods = true } = options;
            const targetAngle = snapRotation(value);
            const renderedAngle = getRenderedRotation(innerGroup, state.inner);
            const currentAngle = getClosestContinuousAngle(state.inner, renderedAngle);
            state.innerTarget = targetAngle;
            state.inner = getClosestAnimatedAngle(currentAngle, targetAngle);
            innerGroup.style.transform = `rotate(${state.inner}deg)`;
            starGroup.style.transform = `rotate(${state.inner}deg)`;
            innerSlider.value = String(state.innerTarget / 36);
            keepInnerItemsUpright();
            updateGodRing(animateGods);
        }

        function initControls() {
            innerSlider.addEventListener("input", (event) => {
                setInnerRotation(Number(event.target.value) * 36);
            });

            document.querySelectorAll("button[data-action]").forEach((button) => {
                button.addEventListener("click", () => {
                    const action = button.dataset.action;

                    if (action === "reset") {
                        setInnerRotation(0);
                        return;
                    }

                    const step = Number(button.dataset.step || 0);
                    setInnerRotation(state.innerTarget + step);
                });
            });
        }

        buildStemRing();
        buildGodRing();
        buildStar();
        initControls();
        setInnerRotation(0, { animateGods: false });
    </script>
</body>
</html>
